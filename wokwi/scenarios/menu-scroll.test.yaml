name: Message Box message menu and scroll
version: 1
author: Message Box
steps:
  - wait-serial: 'STARTUP|HOME_READY'
  - delay: 400ms
  - set-control:
      part-id: button
      control: pressed
      value: 1
  - delay: 200ms
  - set-control:
      part-id: button
      control: pressed
      value: 0
  - wait-serial: 'STATE|MessageDisplay'
  - delay: 400ms
  - set-control:
      part-id: clk-test
      control: pressed
      value: 1
  - delay: 20ms
  - set-control:
      part-id: dt-test
      control: pressed
      value: 1
  - delay: 20ms
  - set-control:
      part-id: clk-test
      control: pressed
      value: 0
  - delay: 20ms
  - set-control:
      part-id: dt-test
      control: pressed
      value: 0
  - wait-serial: 'SCROLL|message|20'
  - delay: 400ms
  - set-control:
      part-id: button
      control: pressed
      value: 1
  - delay: 200ms
  - set-control:
      part-id: button
      control: pressed
      value: 0
  - wait-serial: 'MENU|message|open'
