<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Box</title>
  <style>
    :root {
      --bg-a: #fff7ed;
      --bg-b: #eef7ff;
      --card: #fffdf9;
      --ink: #211b18;
      --muted: #75665e;
      --line: #ead8ca;
      --accent: #d45d4b;
      --accent-2: #366b8c;
      --accent-dark: #9f3f32;
      --blue-soft: #dcecf6;
      --red-soft: #ffe2dc;
      --green: #276749;
      --bad: #ad2424;
      --shadow: 0 24px 70px rgba(64, 45, 35, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 10%, #ffd9cb 0, transparent 32rem),
        radial-gradient(circle at 90% 10%, #cfe7f7 0, transparent 30rem),
        linear-gradient(135deg, var(--bg-a), var(--bg-b));
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(94vw, 520px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      background: rgba(255, 253, 249, 0.92);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top {
      padding: 26px 26px 20px;
      background: linear-gradient(135deg, rgba(255, 226, 220, 0.82), rgba(220, 236, 246, 0.8));
      border-bottom: 1px solid rgba(234, 216, 202, 0.9);
    }

    h1 {
      margin: 0;
      font-size: 1.85rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .content {
      padding: 22px 26px 26px;
    }

    .login,
    .app {
      display: none;
    }

    .visible {
      display: block;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    input {
      height: 46px;
      padding: 0 13px;
    }

    textarea {
      min-height: 92px;
      padding: 12px 13px;
      resize: vertical;
      line-height: 1.35;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px var(--blue-soft);
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 850;
      padding: 0 15px;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      background: var(--accent-2);
    }

    button.secondary:hover {
      background: #234e68;
    }

    button.light {
      background: #f3e5db;
      color: var(--ink);
    }

    button.light:hover {
      background: #ead4c3;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 4px 0 14px;
    }

    .tab {
      height: 48px;
      background: #f6eadf;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), #ec856d);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(212, 93, 75, 0.24);
    }

    .selected {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f6f9fb;
      border: 1px solid #d8e8f2;
      color: var(--accent-2);
      font-weight: 850;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .preset-list {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      display: grid;
      gap: 10px;
    }

    .preset {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      min-height: 48px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .preset span {
      padding-left: 5px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .preset textarea {
      min-height: 58px;
      resize: vertical;
    }

    .small {
      min-height: 36px;
      padding: 0 11px;
      font-size: 0.9rem;
    }

    .empty {
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #fffaf6;
      color: var(--muted);
      text-align: center;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status.ok {
      color: var(--green);
    }

    .status.bad {
      color: var(--bad);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .token-note {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.35;
    }

    @media (max-width: 430px) {
      main {
        border-radius: 14px;
      }

      .top,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .preset {
        grid-template-columns: 1fr auto;
      }

      .preset .delete {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="top">
      <h1>Message Box</h1>
      <p>Private presets for Jack and Ella's boxes.</p>
    </section>

    <section class="content">
      <div id="login" class="login visible">
        <label for="token">Access code</label>
        <div class="row">
          <input id="token" type="password" autocomplete="off" placeholder="Enter code">
          <button id="loginBtn">Enter</button>
        </div>
        <div class="status">This page always asks for the code on each device.</div>
      </div>

      <div id="app" class="app">
        <div class="tabs">
          <button class="tab active" data-person="ella">Ella</button>
          <button class="tab" data-person="jack">Jack</button>
        </div>

        <div class="selected">
          <span id="selectedText">Selected: Ella</span>
          <span id="presetTotal">0/5</span>
        </div>

        <label for="preset">New preset</label>
        <div class="row">
          <textarea id="preset" autocomplete="off" placeholder="Good night :)"></textarea>
          <button id="add">Add</button>
        </div>

        <div class="meta">
          <span>Fits 128x64 OLED: 16 chars x 6 lines</span>
          <span id="count">0/6 lines</span>
        </div>

        <ul id="list" class="preset-list"></ul>

        <div class="footer">
          <div id="status" class="status"></div>
          <button id="logout" class="light small">Logout</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const loginPanel = document.querySelector("#login");
    const appPanel = document.querySelector("#app");
    const tokenInput = document.querySelector("#token");
    const loginBtn = document.querySelector("#loginBtn");
    const tabs = document.querySelectorAll(".tab");
    const selectedText = document.querySelector("#selectedText");
    const presetTotal = document.querySelector("#presetTotal");
    const preset = document.querySelector("#preset");
    const add = document.querySelector("#add");
    const list = document.querySelector("#list");
    const status = document.querySelector("#status");
    const count = document.querySelector("#count");
    const logout = document.querySelector("#logout");

    let apiToken = "";
    let selectedPerson = "ella";
    const OLED_COLS = 16;
    const OLED_ROWS = 6;

    function headers() {
      return {
        "Content-Type": "application/json",
        "box-token": apiToken
      };
    }

    function setStatus(text, type = "") {
      status.textContent = text;
      status.className = type ? `status ${type}` : "status";
    }

    function rowsUsed(text) {
      const clean = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
      if (!clean) return 0;

      return clean.split("\n").reduce((total, line) => {
        return total + Math.max(1, Math.ceil(line.length / OLED_COLS));
      }, 0);
    }

    function fitsDisplay(text) {
      const clean = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
      return clean.length > 0 && rowsUsed(clean) <= OLED_ROWS;
    }

    function cleanInput(input) {
      if (input === preset) {
        const used = rowsUsed(input.value);
        count.textContent = `${used}/6 lines`;
        count.style.color = used > OLED_ROWS ? "var(--bad)" : "";
      }
    }

    function showApp() {
      loginPanel.classList.remove("visible");
      appPanel.classList.add("visible");
      loadPresets();
    }

    function login() {
      apiToken = tokenInput.value.trim();
      if (!apiToken) return;
      showApp();
    }

    function updateSelected(person) {
      selectedPerson = person;
      tabs.forEach(tab => {
        tab.classList.toggle("active", tab.dataset.person === selectedPerson);
      });
      selectedText.textContent = `Selected: ${selectedPerson[0].toUpperCase()}${selectedPerson.slice(1)}`;
      preset.value = "";
      cleanInput(preset);
      loadPresets();
    }

    async function loadPresets() {
      setStatus("Loading...");

      const res = await fetch(`/presets/${selectedPerson}`, { headers: headers() });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.detail || "Could not load presets", "bad");
        presetTotal.textContent = "0/5";
        return;
      }

      renderPresets(data.presets);
      setStatus("Presets loaded", "ok");
    }

    function renderPresets(presets) {
      list.innerHTML = "";
      presetTotal.textContent = `${presets.length}/5`;

      if (presets.length === 0) {
        list.innerHTML = `<div class="empty">No presets saved for ${selectedPerson}.</div>`;
        return;
      }

      presets.forEach((text, index) => {
        const item = document.createElement("li");
        item.className = "preset";
        item.innerHTML = `
          <span></span>
          <button class="secondary small edit">Edit</button>
          <button class="light small delete">Delete</button>
        `;

        item.querySelector("span").textContent = text;
        item.querySelector(".edit").onclick = () => startEdit(item, text, index);
        item.querySelector(".delete").onclick = () => deletePreset(index);
        list.appendChild(item);
      });
    }

    function startEdit(item, oldText, index) {
      item.innerHTML = `
        <textarea></textarea>
        <button class="secondary small save">Save</button>
        <button class="light small cancel">Cancel</button>
      `;

      const editInput = item.querySelector("textarea");
      editInput.value = oldText;
      editInput.focus();
      editInput.addEventListener("input", () => cleanInput(editInput));
      item.querySelector(".save").onclick = () => editPreset(index, editInput.value);
      item.querySelector(".cancel").onclick = loadPresets;
    }

    async function addPreset() {
      const text = preset.value.trim();

      if (!fitsDisplay(text)) {
        setStatus("Preset must fit 16 chars x 6 lines.", "bad");
        return;
      }

      const res = await fetch(`/presets/${selectedPerson}`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ text })
      });

      const data = await res.json();

      if (!res.ok) {
        setStatus(data.detail || "Could not save preset", "bad");
        return;
      }

      preset.value = "";
      cleanInput(preset);
      renderPresets(data.presets);
      setStatus("Preset saved", "ok");
    }

    async function editPreset(index, text) {
      text = text.trim();

      if (!fitsDisplay(text)) {
        setStatus("Preset must fit 16 chars x 6 lines.", "bad");
        return;
      }

      const res = await fetch(`/presets/${selectedPerson}/${index}`, {
        method: "PUT",
        headers: headers(),
        body: JSON.stringify({ text })
      });

      const data = await res.json();

      if (!res.ok) {
        setStatus(data.detail || "Could not edit preset", "bad");
        return;
      }

      renderPresets(data.presets);
      setStatus("Preset updated", "ok");
    }

    async function deletePreset(index) {
      const res = await fetch(`/presets/${selectedPerson}/${index}`, {
        method: "DELETE",
        headers: headers()
      });

      const data = await res.json();

      if (!res.ok) {
        setStatus(data.detail || "Could not delete preset", "bad");
        return;
      }

      renderPresets(data.presets);
      setStatus("Preset deleted", "ok");
    }

    loginBtn.addEventListener("click", login);
    tokenInput.addEventListener("keydown", event => {
      if (event.key === "Enter") login();
    });

    tabs.forEach(tab => {
      tab.addEventListener("click", () => updateSelected(tab.dataset.person));
    });

    preset.addEventListener("input", () => cleanInput(preset));
    preset.addEventListener("keydown", event => {
      if (event.key === "Enter") addPreset();
    });

    add.addEventListener("click", addPreset);
    logout.addEventListener("click", () => location.reload());
    cleanInput(preset);
  </script>
</body>
</html>
