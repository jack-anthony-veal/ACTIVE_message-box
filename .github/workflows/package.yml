project:
  name: message-box
  version: "1.0.0"
  type: embedded_iot

hardware:
  controllers:
    type: ESP32-WROOM
    quantity: 2
    firmware: MicroPython
    version: "1.28.0"

  displays:
    type: ST7789V
    quantity: 2
    resolution: "240x320"
    interface: SPI

  inputs:
    type: digital_rotary_encoder
    quantity: 2

network:
  architecture: client_server
  transport: HTTP
  clients: 2
  backend:
    framework: FastAPI
    hosting: self_hosted

software:
  language: MicroPython
  source_directory: src/client
  test_directory: src/tests
  demo_directory: demo

features:
  - message_exchange
  - rotary_encoder_navigation
  - colour_LCD_interface
  - main_menu
  - messages
  - presets
  - settings

configuration:
  client_firmware:
    canonical_file: src/client/config/config.py
  host_token:
    environment_variable: MESSAGE_BOX_TOKEN
    required: true

  secrets:
    stored_in_environment: true
    committed_to_repository: false

development:
  version_control: git
  testing: true
  local_tests: true
  hardware_validation: manual

security:
  credentials_in_repository: false
  private_endpoints_in_repository: false
  secrets_in_repository: false

status:
  prototype: true
  multi_device: true
